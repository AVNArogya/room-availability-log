<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f6b5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Room Log">
  <title>Room Availability Log</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28">
      <div>
        <h1>Room Availability Log</h1>
        <p class="sub">One row per patient who couldn't get the room asked for</p>
      </div>
    </div>
    <div class="sync" id="sync" title="Sync status"><span class="dot"></span><span id="syncText">…</span></div>
  </header>

  <div class="banner" id="demoBanner" hidden>
    Demo mode — entries are saved only in this browser. Set <code>API_URL</code> in <code>config.js</code> to write to Google Sheets.
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-view="form" class="active" id="tabForm">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New entry</span>
    </button>
    <button role="tab" data-view="list" id="tabList">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Entries</span>
    </button>
  </nav>

  <main>
    <!-- ENTRY FORM -->
    <section id="view-form" class="view active">
      <form id="entryForm" novalidate autocomplete="off">
        <input type="hidden" name="id">
        <div class="form-head">
          <h2 id="formTitle">New entry</h2>
          <button type="button" class="link" id="cancelEdit" hidden>Cancel edit</button>
        </div>

        <fieldset>
          <legend>Enquiry &amp; patient</legend>
          <div class="grid">
            <label><span>Enquiry date <b class="req">*</b></span><input type="date" name="enquiryDate" required></label>
            <label><span>Patient name <b class="req">*</b></span><input name="patientName" required placeholder="Full name"></label>
            <label><span>Phone <b class="req">*</b></span>
              <span class="phone-row">
                <select id="countryCode" aria-label="Country code">
                  <option value="+91">🇮🇳 +91</option>
                  <option value="+1">🇺🇸 +1</option>
                  <option value="+44">🇬🇧 +44</option>
                  <option value="+971">🇦🇪 +971</option>
                  <option value="+966">🇸🇦 +966</option>
                  <option value="+974">🇶🇦 +974</option>
                  <option value="+965">🇰🇼 +965</option>
                  <option value="+968">🇴🇲 +968</option>
                  <option value="+973">🇧🇭 +973</option>
                  <option value="+65">🇸🇬 +65</option>
                  <option value="+60">🇲🇾 +60</option>
                  <option value="+61">🇦🇺 +61</option>
                  <option value="+64">🇳🇿 +64</option>
                  <option value="+94">🇱🇰 +94</option>
                  <option value="+977">🇳🇵 +977</option>
                  <option value="+880">🇧🇩 +880</option>
                  <option value="+49">🇩🇪 +49</option>
                  <option value="+33">🇫🇷 +33</option>
                  <option value="+39">🇮🇹 +39</option>
                  <option value="+31">🇳🇱 +31</option>
                  <option value="+41">🇨🇭 +41</option>
                  <option value="+7">🇷🇺 +7</option>
                  <option value="+27">🇿🇦 +27</option>
                </select>
                <input name="phone" type="tel" inputmode="numeric" placeholder="10-digit mobile" required>
              </span>
            </label>
            <label><span>UHID <span id="uhidHint">(if registered)</span> <b class="req" id="uhidReq" hidden>*</b></span><input name="uhid" placeholder="Required for returning patients" autocapitalize="characters"></label>
            <label><span>New / returning <b class="req">*</b></span><select name="newOrReturning" data-list="newOrReturning" required></select></label>
            <label><span>City / district <b class="req">*</b></span><input name="city" required></label>
            <label><span>Source <b class="req">*</b></span><input name="source" list="dl-source" required></label>
            <label><span>Condition <b class="req">*</b></span><input name="condition" placeholder="e.g. Disc bulge" required></label>
            <label><span>Advising doctor <b class="req">*</b></span><input name="doctor" list="dl-doctor" required></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Room request</legend>
          <div class="grid">
            <label><span>Planned stay (days) <b class="req">*</b></span><input name="plannedStay" type="number" min="1" inputmode="numeric" required></label>
            <label><span>Room category asked for <b class="req">*</b></span><select name="categoryAsked" data-list="roomCategory" required></select></label>
            <label><span>Offered room <b class="req">*</b></span><select name="offeredRoom" data-list="offeredRoom" required></select></label>
            <label><span>Date patient wanted <b class="req">*</b></span><input type="date" name="dateWanted" required></label>
            <label><span>Offered instead <b class="req">*</b></span><input name="offeredInstead" list="dl-offeredInstead" required></label>
            <label><span>Earliest date we could give <b class="req">*</b></span><input type="date" name="earliestDate" required></label>
            <label class="calc">Wait (days)<output id="waitOut">—</output></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Outcome</legend>
          <div class="grid">
            <label>Status<select name="status" data-list="status"></select></label>
            <label>Admission date<input type="date" name="admissionDate"></label>
            <label>Category admitted to<select name="categoryAdmitted" data-list="roomCategory" data-blank="1"></select></label>
            <label>Reason not admitted<input name="reasonNotAdmitted" list="dl-reasonNotAdmitted"></label>
            <label>Where they went (if known)<input name="wentWhere"></label>
            <label>Last follow-up<input type="date" name="lastFollowUp"></label>
            <label class="calc">Patient-days lost<output id="daysLostOut">0</output></label>
            <label class="calc">Revenue lost (₹)<output id="revenueOut">₹0</output></label>
            <label class="wide">Remarks<textarea name="remarks" rows="2"></textarea></label>
            <label><span>Entered by <b class="req">*</b></span><input name="enteredBy" list="dl-enteredBy" required></label>
          </div>
        </fieldset>

        <div class="actions">
          <button type="button" class="secondary" id="resetBtn">Clear</button>
          <button type="submit" class="primary" id="saveBtn">Save entry</button>
        </div>
      </form>
    </section>

    <!-- ENTRIES LIST -->
    <section id="view-list" class="view">
      <div class="list-tools">
        <input type="search" id="search" placeholder="Search name, phone, UHID, city…">
        <select id="statusFilter"><option value="">All statuses</option></select>
        <button class="secondary" id="refreshBtn" type="button">Refresh</button>
      </div>
      <div class="stats" id="stats"></div>
      <div id="pending" class="pending" hidden></div>
      <ul class="entries" id="entries"></ul>
      <p class="empty" id="empty" hidden>No entries yet.</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <datalist id="dl-source"></datalist>
  <datalist id="dl-doctor"></datalist>
  <datalist id="dl-offeredInstead"></datalist>
  <datalist id="dl-reasonNotAdmitted"></datalist>
  <datalist id="dl-enteredBy"></datalist>

  <script src="config.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
